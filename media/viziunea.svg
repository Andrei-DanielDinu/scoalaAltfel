<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Educația continuă de-a lungul vieții</title>
  <desc id="desc">Cinci etape conectate: explorare, fundamente, specializare, învățare flexibilă și mentorat.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f8f6"/>
      <stop offset="1" stop-color="#e8f0fb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .label { font: 700 15px system-ui, sans-serif; letter-spacing: 1.5px; fill: #526176; }
      .age { font: 700 23px system-ui, sans-serif; fill: #172033; }
      .body { font: 500 16px system-ui, sans-serif; fill: #39465b; }
      .number { font: 800 22px system-ui, sans-serif; fill: white; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>
  <rect width="1200" height="370" rx="28" fill="url(#bg)"/>
  <text x="56" y="57" class="label">ȘCOALA ALTFEL · EDUCAȚIE PE TOT PARCURSUL VIEȚII</text>
  <path d="M164 180 H1034" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g transform="translate(46 100)">
    <rect width="205" height="188" rx="20" fill="#ffffff" stroke="#d6e2e8" stroke-width="2"/>
    <circle cx="32" cy="32" r="20" fill="#2f7f76"/><text x="32" y="33" class="number">1</text>
    <text x="24" y="88" class="age">0–9 ani</text>
    <text x="24" y="120" class="body">Explorare, joacă</text><text x="24" y="144" class="body">și relații sigure</text>
  </g>
  <g transform="translate(275 100)">
    <rect width="205" height="188" rx="20" fill="#ffffff" stroke="#d6e2e8" stroke-width="2"/>
    <circle cx="32" cy="32" r="20" fill="#4c78a8"/><text x="32" y="33" class="number">2</text>
    <text x="24" y="88" class="age">10–19 ani</text>
    <text x="24" y="120" class="body">Fundamente, practică</text><text x="24" y="144" class="body">și explorare</text>
  </g>
  <g transform="translate(504 100)">
    <rect width="205" height="188" rx="20" fill="#ffffff" stroke="#d6e2e8" stroke-width="2"/>
    <circle cx="32" cy="32" r="20" fill="#9a6a32"/><text x="32" y="33" class="number">3</text>
    <text x="24" y="88" class="age">20–29 ani</text>
    <text x="24" y="120" class="body">Studiu, muncă</text><text x="24" y="144" class="body">și specializare</text>
  </g>
  <g transform="translate(733 100)">
    <rect width="205" height="188" rx="20" fill="#ffffff" stroke="#d6e2e8" stroke-width="2"/>
    <circle cx="32" cy="32" r="20" fill="#8759a3"/><text x="32" y="33" class="number">4</text>
    <text x="24" y="88" class="age">30–59 ani</text>
    <text x="24" y="120" class="body">Învățare flexibilă</text><text x="24" y="144" class="body">pentru viață și muncă</text>
  </g>
  <g transform="translate(962 100)">
    <rect width="205" height="188" rx="20" fill="#ffffff" stroke="#d6e2e8" stroke-width="2"/>
    <circle cx="32" cy="32" r="20" fill="#bd5a4a"/><text x="32" y="33" class="number">5</text>
    <text x="24" y="88" class="age">60–99+ ani</text>
    <text x="24" y="120" class="body">Autonomie, creație</text><text x="24" y="144" class="body">și mentorat</text>
  </g>
  <text x="56" y="332" class="body">Orice vârstă poate aduce un nou început, o nouă întrebare sau o direcție diferită.</text>
</svg>
